# Offline verification gate (same steps as tools/verify.ps1).
# Does not open Roblox Studio. Does not use git-ignored reference/ photos,
# thumbs, sheets, or places/*.rbxm. Geometry QA on build.rbxm / props_preview.rbxm
# is skipped when those files are absent (they are git-ignored).
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rokit
        uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps (blueprint gate)
        run: pip install shapely pillow

      - name: stylua --check
        run: stylua --check src

      - name: selene
        run: selene src

      - name: rojo build
        run: rojo build default.project.json -o /tmp/twentyhours-verify.rbxl

      - name: blueprint geometry
        if: hashFiles('blueprint/level1.json') != ''
        run: python tools/verify_blueprint.py

      - name: blueprint schema
        if: hashFiles('tools/validate_blueprint.luau') != ''
        run: lune run tools/validate_blueprint.luau

      - name: lune tests
        run: |
          set -e
          for f in tests/*.spec.luau; do
            echo "test $(basename "$f")"
            lune run "$f"
          done

      - name: prop geometry
        if: hashFiles('places/props_preview.rbxm') != ''
        run: lune run tools/check_geometry.luau places/props_preview.rbxm none

      - name: building geometry
        if: hashFiles('places/build.rbxm') != '' && hashFiles('blueprint/level1.json') != ''
        run: lune run tools/check_geometry.luau places/build.rbxm blueprint

      - name: luau-lsp analyze
        if: hashFiles('tools/globalTypes.d.luau') != ''
        run: |
          rojo sourcemap default.project.json -o sourcemap.json
          luau-lsp analyze --definitions=tools/globalTypes.d.luau --sourcemap=sourcemap.json --no-strict-dm-types src
